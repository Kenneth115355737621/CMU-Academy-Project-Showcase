<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="page-title">CMU Academy Project Overview</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card-bg: #ffffff;
      --text-main: #1b2233;
      --text-muted: #6b7385;
      --border: #e6e9f2;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      background: var(--bg);
      background-image: 
        radial-gradient(1000px 500px at 10% 0%, #e0e8ff 0%, transparent 60%),
        radial-gradient(800px 500px at 90% 10%, #ffe8f0 0%, transparent 50%);
      background-attachment: fixed;
      overflow-x: hidden;
    }

    /* ---------- View Containers ---------- */
    .view {
      display: none;
      animation: fadeIn 0.4s ease forwards;
    }
    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ---------- Dashboard Layout ---------- */
    .dashboard-header {
      text-align: center;
      padding: 80px 20px 50px;
    }
    .dashboard-header h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .rule {
      width: 70px;
      height: 5px;
      margin: 24px auto 0;
      border-radius: 99px;
      background: linear-gradient(90deg, #4f6bed, #b45cf0, #ff7a9c);
    }

    .dashboard-grid {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px 80px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }

    /* ---------- Dashboard Cards ---------- */
    .menu-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 30px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(24, 32, 56, 0.03);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }
    .menu-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px -10px rgba(24, 32, 56, 0.15);
      border-color: transparent;
    }
    .menu-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: var(--accent, #4f6bed);
      opacity: 0.8;
    }
    .menu-card-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--accent, #4f6bed);
      color: white;
      font-weight: 800;
      font-size: 1.2rem;
      box-shadow: 0 8px 16px -6px var(--accent, #4f6bed);
    }
    .menu-card h2 { margin: 0; font-size: 1.4rem; font-weight: 700; }
    .menu-card p { margin: 0; color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; flex-grow: 1; }
    .menu-card .action-text {
      font-weight: 600;
      color: var(--accent, #4f6bed);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
    }
    .menu-card:hover .action-text span { transform: translateX(4px); }

    /* ---------- Viewer Layout ---------- */
    .viewer-header {
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 20px; }
    .back-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .back-btn:hover { background: #f0f3fa; transform: translateX(-2px); }
    .viewer-title { font-weight: 800; font-size: 1.4rem; color: var(--text-main); }

    .viewer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 24px 60px;
      gap: 32px; 
    }
    
    /* ---------- Common Box Styling ---------- */
    .project-box, .info-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px -10px rgba(24, 32, 56, 0.15);
      width: 100%;
    }

    /* ---------- Project Box (Fixed Size) ---------- */
    .project-box {
      max-width: 442px; 
      padding: 16px;
      line-height: 0;
    }
    .project-box iframe {
      width: 410px;
      height: 460px;
      max-width: 100%;
      border: 0;
      border-radius: 8px;
      background: #fff;
    }

    /* ---------- Info Panels (Grows with Window) ---------- */
    .info-panel {
      max-width: 900px; 
      padding: 32px;
      display: flex;
      flex-direction: column;
      line-height: 1.6;
      border-top: 6px solid var(--accent, #4f6bed);
      animation: fadeIn 0.5s ease forwards;
    }
    .info-panel-title {
      margin: 0 0 16px 0;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-main);
    }
    .info-panel-content {
      color: var(--text-muted);
      font-size: 1rem;
      flex-grow: 1;
    }

    /* ---------- Content Inside Panels ---------- */
    .info-panel-content p { margin-top: 0; margin-bottom: 12px; }
    .info-panel-content ul, .info-panel-content ol { padding-left: 20px; margin-bottom: 12px; }
    .info-panel-content li { margin-bottom: 6px; }
    .info-panel-content a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .info-panel-content a:hover { text-decoration: underline; }

    /* Code block styling */
    pre {
      margin: 0;
      box-sizing: border-box;
    }
    pre code {
      white-space: pre;
      overflow-x: auto;
      overflow-y: auto;
      max-height: 400px;
      display: block;
      max-width: 100%;
      box-sizing: border-box;
      padding: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      background: #1f2937;
      color: #e5e7eb;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      .dashboard-header { padding: 50px 20px 30px; }
      .viewer-header { flex-direction: column; align-items: flex-start; gap: 16px; }
      .header-left { flex-direction: column; align-items: flex-start; gap: 12px; }
      .project-box iframe { width: 100%; }
      .info-panel { padding: 20px; }
    }
  </style>
</head>

      panelsContainer.innerHTML = ''; 
      
      if (unit.panels && unit.panels.length > 0) {
        unit.panels.forEach(panel => {
          const panelEl = document.createElement('div');
          panelEl.className = 'info-panel';
          panelEl.style.setProperty('--accent', unit.color);
          
          panelEl.innerHTML = `
            <h3 class="info-panel-title">${panel.title}</h3>
            <div class="info-panel-content">${panel.content}</div>
          `;
          
          panelsContainer.appendChild(panelEl);
        });
      }

      window.scrollTo(0, 0);
